[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceinspect"
version = "0.1.0"
description = "Local-first multimodal industrial equipment diagnosis assistant"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.0.37",
  "alembic==1.14.1",
  "pydantic-settings==2.7.1",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "PyMuPDF==1.25.3",
  "python-docx==1.1.2",
  "Pillow==11.1.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.2",
  "anyio==4.8.0",
]
audio = [
  "faster-whisper==1.1.1",
  "pyttsx3==2.98",
  "requests==2.32.3",
]
vector = [
  "qdrant-client==1.13.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["backend*"]
